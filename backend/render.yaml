services:
  - type: web
    name: automation-dashboard-backend
    plan: free
    rootDir: backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: MONGODB_URI
        sync: false
